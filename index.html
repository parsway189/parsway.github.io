<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Simple Online Store</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; background: #f7f7f7; }
    h1 { color: #333; }
    .product {
      border: 1px solid #ccc;
      padding: 10px;
      margin-bottom: 10px;
      background: #fff;
      display: flex;
      align-items: center;
      gap: 20px;
    }
    .product img {
      max-width: 100px;
      height: auto;
    }
    .cart { margin-top: 20px; background: #f0f0f0; padding: 10px; }
    .btn { padding: 5px 10px; margin-top: 5px; }
    .hidden { display: none; }
  </style>
</head>
<body>

  <h1>Online Store</h1>

  <div id="products"></div>

  <div class="cart">
    <h2>Your Cart</h2>
    <div id="cart-items"></div>
    <p id="total">Total: $0</p>
    <button onclick="checkout()">Checkout</button>
  </div>

  <!-- Checkout Modal -->
  <div id="checkout-modal" class="hidden">
    <h3>Enter Your Details</h3>
    <form id="checkout-form">
      <label for="name">Name:</label>
      <input type="text" id="name" required><br>
      <label for="address">Address:</label>
      <input type="text" id="address" required><br>
      <label for="phone">Phone Number:</label>
      <input type="tel" id="phone" required><br>
      <label for="email">Email:</label>
      <input type="email" id="email" required><br>

      <h4>Payment Method</h4>
      <label for="payment-method">Choose a payment method:</label>
      <select id="payment-method">
        <option value="credit-card">Credit Card</option>
        <option value="paypal">PayPal</option>
        <option value="cod">Cash on Delivery</option>
      </select><br>

      <div id="credit-card-details" class="hidden">
        <label for="card-number">Card Number:</label>
        <input type="text" id="card-number"><br>
        <label for="expiry-date">Expiry Date:</label>
        <input type="text" id="expiry-date"><br>
        <label for="cvv">CVV:</label>
        <input type="text" id="cvv"><br>
      </div>

      <button type="submit" class="btn">Place Order</button>
    </form>
  </div>

  <script>
    const products = [
      { id: 1, name: "Laptop", price: 1200, image: "https://via.placeholder.com/100?text=Laptop" },
      { id: 2, name: "Phone", price: 800, image: "https://via.placeholder.com/100?text=Phone" },
      { id: 3, name: "Headphones", price: 100, image: "https://via.placeholder.com/100?text=Headphones" },
      { id: 4, name: "Smart Watch", price: 250, image: "https://via.placeholder.com/100?text=Watch" }
    ];

    const cart = {};

    // Display products in store
    function displayProducts() {
      const container = document.getElementById("products");
      products.forEach(product => {
        const div = document.createElement("div");
        div.className = "product";
        div.innerHTML = `
          <img src="${product.image}" alt="${product.name}">
          <div>
            <strong>${product.name}</strong> - $${product.price}<br>
            Quantity: <input type="number" id="qty-${product.id}" value="1" min="1"><br>
            <button class="btn" onclick="addToCart(${product.id})">Add to Cart</button>
          </div>
        `;
        container.appendChild(div);
      });
    }

    // Add product to the cart
    function addToCart(productId) {
      const product = products.find(p => p.id === productId);
      const qty = parseInt(document.getElementById(`qty-${product.id}`).value);
      if (cart[productId]) {
        cart[productId].quantity += qty;
      } else {
        cart[productId] = { product, quantity: qty };
      }
      updateCartDisplay();
    }

    // Update cart display
    function updateCartDisplay() {
      const container = document.getElementById("cart-items");
      container.innerHTML = "";
      let total = 0;
      for (const key in cart) {
        const item = cart[key];
        const subtotal = item.quantity * item.product.price;
        total += subtotal;
        const div = document.createElement("div");
        div.innerText = `${item.product.name} - ${item.quantity} x $${item.product.price} = $${subtotal}`;
        container.appendChild(div);
      }
      document.getElementById("total").innerText = `Total: $${total}`;
    }

    // Checkout process
    function checkout() {
      if (Object.keys(cart).length === 0) {
        alert("Your cart is empty.");
        return;
      }

      const checkoutModal = document.getElementById("checkout-modal");
      checkoutModal.classList.remove("hidden");
    }

    // Handle checkout form submission
    document.getElementById("checkout-form").addEventListener("submit", function (event) {
      event.preventDefault();

      const name = document.getElementById("name").value;
      const address = document.getElementById("address").value;
      const phone = document.getElementById("phone").value;
      const email = document.getElementById("email").value;
      const paymentMethod = document.getElementById("payment-method").value;

      if (paymentMethod === "credit-card") {
        const cardNumber = document.getElementById("card-number").value;
        const expiryDate = document.getElementById("expiry-date").value;
        const cvv = document.getElementById("cvv").value;
        if (!cardNumber || !expiryDate || !cvv) {
          alert("Please fill in all card details.");
          return;
        }
      } else if (paymentMethod === "paypal") {
        alert("PayPal payment is being processed.");
      } else if (paymentMethod === "cod") {
        const otp = Math.floor(1000 + Math.random() * 90000);
        alert(`Your OTP for delivery is: ${otp}`);
      }

      const deliveryDate = new Date();
      deliveryDate.setDate(deliveryDate.getDate() + 5);
      const formattedDate = deliveryDate.toISOString().split('T')[0];

      alert(`
        Order Summary:
        Name: ${name}
        Address: ${address}
        Phone: ${phone}
        Email: ${email}
        Payment Method: ${paymentMethod}
        Delivery Date: ${formattedDate}
        
        Thank you for your purchase! Your order will be delivered by ${formattedDate}.
      `);

      document.getElementById("checkout-modal").classList.add("hidden");
    });

    // Show/hide credit card details based on payment method
    document.getElementById("payment-method").addEventListener("change", function (event) {
      const paymentMethod = event.target.value;
      const creditCardDetails = document.getElementById("credit-card-details");
      if (paymentMethod === "credit-card") {
        creditCardDetails.classList.remove("hidden");
      } else {
        creditCardDetails.classList.add("hidden");
      }
    });

    displayProducts();
  </script>
</body>
</html>
